<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 留言板 / Guestbook</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📝</text></svg>">
</head>
<body>
    <div class="container">
        <!-- 头部 -->
        <header class="header">
            <h1>📝 留言板</h1>
            <p class="subtitle">欢迎留下你的足迹，说点什么吧～</p>
            <div class="stats">
                <span id="msgCount">加载中...</span>
            </div>
        </header>

        <!-- 留言表单 -->
        <section class="form-section">
            <h2>✏️ 写下留言</h2>
            <form id="guestbookForm" class="guestbook-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="username">昵称</label>
                        <input type="text" id="username" placeholder="请输入你的昵称" required maxlength="20">
                    </div>
                    <div class="form-group">
                        <label for="email">邮箱（选填）</label>
                        <input type="email" id="email" placeholder="your@email.com" maxlength="50">
                    </div>
                </div>
                <div class="form-group">
                    <label for="message">留言内容</label>
                    <textarea id="message" placeholder="说点什么吧...（支持换行）" required maxlength="500" rows="4"></textarea>
                    <div class="char-count"><span id="charCount">0</span> / 500</div>
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        <span class="btn-text">🚀 发布留言</span>
                        <span class="btn-loading" style="display:none;">⏳ 提交中...</span>
                    </button>
                    <button type="reset" class="btn-reset">🗑️ 清空</button>
                </div>
            </form>
            <div id="formStatus" class="form-status"></div>
        </section>

        <!-- 留言列表 -->
        <section class="messages-section">
            <div class="section-header">
                <h2>💬 所有留言</h2>
                <div class="sort-tabs">
                    <button class="sort-btn active" data-sort="newest">最新</button>
                    <button class="sort-btn" data-sort="oldest">最早</button>
                </div>
            </div>
            <div id="messagesList" class="messages-list">
                <div class="loading">🔄 正在加载留言...</div>
            </div>
            <div id="loadMoreContainer" class="load-more-container" style="display:none;">
                <button id="loadMoreBtn" class="btn-load-more">📥 加载更多</button>
            </div>
        </section>

        <!-- 页脚 -->
        <footer class="footer">
            <p>💡 留言通过 GitHub Issues 存储 | <a href="#" id="configLink">⚙️ 配置</a></p>
        </footer>
    </div>

    <!-- 配置弹窗 -->
    <div id="configModal" class="modal" style="display:none;">
        <div class="modal-content">
            <span class="modal-close" id="modalClose">&times;</span>
            <h2>⚙️ GitHub 配置</h2>
            <p class="config-tip">
                留言板使用 GitHub Issues 作为存储。<br>
                请填写你的 GitHub 仓库信息：
            </p>
            <div class="form-group">
                <label>GitHub 用户名</label>
                <input type="text" id="cfgOwner" placeholder="如：octocat">
            </div>
            <div class="form-group">
                <label>仓库名称</label>
                <input type="text" id="cfgRepo" placeholder="如：guestbook">
            </div>
            <div class="form-group">
                <label>GitHub Token（可选，提高API限额）</label>
                <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx">
                <small>Token 仅保存在本地浏览器，不会上传。</small>
            </div>
            <button id="saveConfig" class="btn-submit">💾 保存配置</button>
            <div id="configStatus" class="form-status"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
